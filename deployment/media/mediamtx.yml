# Effective listener and transport schema pinned to MediaMTX 1.19.3.
# The source, reachable ICE binds, and TURN credentials are supplied only by the
# strictly validated static and generated MTX_ environment overrides.
logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s

authMethod: http
authHTTPAddress: http://127.0.0.1:9189/auth

api: true
apiAddress: 127.0.0.1:9997
metrics: true
metricsAddress: 127.0.0.1:9998
pprof: false
pprofAddress: 127.0.0.1:9999
playback: false
playbackAddress: 127.0.0.1:9996

# The RTSP server is TCP-only and loopback-only for the isolated transcoder.
rtsp: true
rtspTransports: ["tcp"]
rtspAddress: 127.0.0.1:8554
rtspsAddress: 127.0.0.1:8322
rtpAddress: 127.0.0.1:8000
rtcpAddress: 127.0.0.1:8001

rtmp: false
rtmpAddress: 127.0.0.1:1935
rtmpsAddress: 127.0.0.1:1936
hls: false
hlsAddress: 127.0.0.1:8888
srt: false
srtAddress: 127.0.0.1:8890
moq: false
moqHTTP2Address: 127.0.0.1:8892
moqHTTP3Address: 127.0.0.1:8892

# nginx proxies WHEP HTTP signaling only. Media uses the validated ICE/TURN
# settings injected by the gateway environment; there is no local fallback.
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: []
webrtcLocalUDPAddress: ""
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: false
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []
webrtcICEServers2: []

pathDefaults:
  sourceOnDemand: false

paths:
  camera: {}
  gate:
    source: publisher
    overridePublisher: false
