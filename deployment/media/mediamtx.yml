# The credential-bearing source is supplied only as MTX_PATHS_GATE_SOURCE.
logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s

authMethod: http
authHTTPAddress: http://127.0.0.1:9189/auth

api: true
apiAddress: 127.0.0.1:9997
metrics: true
metricsAddress: 127.0.0.1:9998

rtsp: true
rtspAddress: 127.0.0.1:8554
rtmp: false
hls: false
srt: false

# A TLS reverse proxy may expose only the WHEP create and teardown routes.
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcAllowOrigins: []
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcLocalTCPAddress: 127.0.0.1:8189

pathDefaults:
  sourceOnDemand: false

paths:
  gate: {}
